name: reusable-build
on:
  workflow_call:
    inputs:
      java-version:
        type: string
        default: "21"
      module:
        type: string
        required: true
    outputs:
      artifact:
        description: Name of the uploaded jar
        value: ${{ jobs.build.outputs.artifact }}
    secrets:
      registry-token:
        required: false
jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      artifact: orders-${{ inputs.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          cache: maven
      - run: mvn -B -ntp -pl ${{ inputs.module }} verify
      - uses: actions/upload-artifact@v4
        with:
          name: orders-${{ inputs.module }}
          path: ${{ inputs.module }}/target/*.jar
