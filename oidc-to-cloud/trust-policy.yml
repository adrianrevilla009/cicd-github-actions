# IAM role trust policy (as YAML) that makes keyless auth safe: pin the repo AND the environment.
Version: "2012-10-17"
Statement:
  - Effect: Allow
    Principal:
      Federated: arn:aws:iam::123456789012:oidc-provider/token.actions.githubusercontent.com
    Action: sts:AssumeRoleWithWebIdentity
    Condition:
      StringEquals:
        token.actions.githubusercontent.com:aud: sts.amazonaws.com
        token.actions.githubusercontent.com:sub: repo:adrianrevilla009/orders:environment:production
